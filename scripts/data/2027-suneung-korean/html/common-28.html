<p class="ex-stem"><b>28.</b> ㉠～㉤에 대한 이해로 적절하지 <u>않은</u> 것은?</p>
<ol class="ex-choices">
<li>① ㉠은 움직임에 대한 의식을 통해 ‘그’가 시간의 흐름을 감지하고 있음을 드러낸다.</li>
<li>② ㉡은 ‘그’가 느끼는 고통의 원인에 대해 추측한 바를 나타낸다.</li>
<li>③ ㉢은 이전에 하던 생각을 이어가고 있음을 ‘그’의 행동과 함께 나타낸다.</li>
<li>④ ㉣은 ‘그’의 감정 상태가 자신도 의식하지 못한 채 얼굴 표정으로 드러난 것임을 보여 준다.</li>
<li>⑤ ㉤은 기억을 통해 떠올린 일이 반복되는 데 대한 ‘그’의 의아함을 드러낸다.</li>
</ol>
