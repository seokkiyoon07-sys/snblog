<p class="ex-stem"><b>5.</b> [A]를 통해 알 수 있는 ‘기화’의 견해로 적절하지 <u>않은</u> 것은?</p>
<ol class="ex-choices">
<li>① 사후에 육체가 사라진다고 해서 마음이 전부 사라지는 것은 아니다.</li>
<li>② 불교에서는 유교의 덕목과 상응하는 윤리적 가치를 실천 윤리로 다룬다.</li>
<li>③ 불교와 유교는 국가의 안녕을 기원하므로 국가 운영의 책무에 대해 서로를 대신할 수 있다.</li>
<li>④ 인과응보는 외적 제재가 가해지지 않는 상황에서도 백성의 악행을 억제하는 효과가 있다.</li>
<li>⑤ 승려의 출가는 백성과 국가를 외면하는 것이 아니라 공적인 책임을 행하는 것으로 이어진다.</li>
</ol>
