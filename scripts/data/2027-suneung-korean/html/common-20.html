<p class="ex-stem"><b>20.</b> ㉠～㉤에 대한 이해로 적절하지 <u>않은</u> 것은?</p>
<ol class="ex-choices">
<li>① ㉠: 성 부인은 아들과 함께하는 것보다 죽은 아우의 부탁을 들어주는 것을 우선하였다.</li>
<li>② ㉡: 화춘은 심 씨가 꾸미고 있는 계획을 수긍하였다.</li>
<li>③ ㉢: 범한은 자신이 직접 가서 일을 성공시키고자 하였다.</li>
<li>④ ㉣: 화진은 문목의 내용이 거짓임을 알았지만 진실을 밝히지 않아야겠다고 생각하였다.</li>
<li>⑤ ㉤: 최형은 자신의 말을 가로막은 범한에게 분노하며 화씨 가문과의 관계를 추궁하였다.</li>
</ol>
