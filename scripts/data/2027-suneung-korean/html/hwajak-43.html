<p class="ex-stem"><b>43.</b> 초고에 반영된 글쓰기 계획으로 가장 적절한 것은?</p>
<ol class="ex-choices">

<li>③ 작은 영화관과 민간 영화관의 규모 차이를 제시해야겠어.</li>
<li>④ 민간 영화관과 작은 영화관 각각의 운영 주체를 제시해야겠어.</li>
<li>⑤ 작은 영화관을 도입하기 위한 단계별 지원 방안을 제시해야겠어.</li>
</ol>
