<p class="ex-stem"><b>7.</b> ㉠과 ㉡에 대한 설명으로 가장 적절한 것은?</p>
<ol class="ex-choices">
<li>① ㉠은 불교를 배척하는 근거로, ㉡은 유교를 비판하는 논리로 활용된다.</li>
<li>② ㉠은 유교가 불교보다 나은 점에, ㉡은 불교가 유교보다 나은 점에 주목한다.</li>
<li>③ ㉠은 유교를 불교와 구별 짓는 인식을, ㉡은 불교를 용납하는 태도를 포함한다.</li>
<li>④ ㉠은 유교적 질서의 정당화를, ㉡은 불교 문헌에 대한 비판적 탐구를 경계한다.</li>
<li>⑤ ㉠은 불교에 경도된 시각을, ㉡은 유교를 학문의 근간으로 보는 시각을 내재한다.</li>
</ol>
