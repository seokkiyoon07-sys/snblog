<p class="ex-stem"><b>35.</b> 윗글을 바탕으로 문장을 분석한 내용으로 적절한 것은?</p>
<ol class="ex-choices">
<li>① ‘새벽이 밝았어.’의 직접 구성 요소 각각은 단어이다.</li>
<li>② ‘눈이 내렸군.’의 직접 구성 요소 각각을 이루는 형태소의 개수는 서로 같다.</li>
<li>③ ‘땀이 꽤 흘렀네.’의 직접 구성 요소 각각을 이루는 단어의 개수는 서로 다르다.</li>
<li>④ ‘마음도 매우 바르지.’의 직접 구성 요소 각각을 이루는 실질 형태소의 개수는 서로 같다.</li>
<li>⑤ ‘바퀴만은 돌아요.’의 직접 구성 요소 각각을 이루는 의존 형태소의 개수는 서로 다르다.</li>
</ol>
