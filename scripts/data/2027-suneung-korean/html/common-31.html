<p class="ex-stem"><b>31.</b> (가)～(다)의 표현상 특징에 대한 설명으로 가장 적절한 것은?</p>
<ol class="ex-choices">
<li>① (가)는 청각적 이미지를 활용하여 장면의 고조된 분위기를 드러내고 있다.</li>
<li>② (나)는 명암의 대비를 활용하여 대상의 변화 과정을 부각하고 있다.</li>
<li>③ (다)는 반복적 표현을 활용하여 대상과의 일체감을 드러내고 있다.</li>
<li>④ (가)와 (나)는 모두, 영탄적 표현을 통해 화자의 회고적 태도를 드러내고 있다.</li>
<li>⑤ (가)와 (다)는 모두, 의인화된 대상과 대화하는 방식으로 시상을 전개하고 있다.</li>
</ol>
