<p class="ex-stem"><b>10.</b> 윗글을 통해 알 수 있는 내용으로 적절하지 <u>않은</u> 것은?</p>
<ol class="ex-choices">
<li>① 가상 메모리는 보조 기억 장치보다 용량이 작다.</li>
<li>② 실행되는 프로그램의 개수만큼 테이블이 생성된다.</li>
<li>③ 프레임에 있는 명령어와 데이터는 CPU가 처리한다.</li>
<li>④ 프레임은 명령어가 저장되는 보조 기억 장치에 만들어진다.</li>
<li>⑤ 물리 메모리는 분할되어 사용된다는 점이 가상 메모리와 같다.</li>
</ol>
