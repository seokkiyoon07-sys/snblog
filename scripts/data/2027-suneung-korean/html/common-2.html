<p class="ex-stem"><b>2.</b> <span class="ex-box">디지털 문서를 읽는 독자</span>에게 요구되는 태도에 대한 이해로 적절하지 <u>않은</u> 것은?</p>
<ol class="ex-choices">
<li>① 자신의 이해가 제한적일 수 있음을 인정해야 한다.</li>
<li>② 자신이 이해했다고 생각한다면 근거를 들 수 있어야 한다.</li>
<li>③ 자신의 이해가 깊이 있는 수준에 도달했는지 성찰해야 한다.</li>
<li>④ 자신의 이해를 보완하려면 탐색의 양을 늘리는 것을 우선시해야 한다.</li>
<li>⑤ 자신의 이해가 균형을 잃고 왜곡되어 있지는 않은지 스스로 살펴보아야 한다.</li>
</ol>
