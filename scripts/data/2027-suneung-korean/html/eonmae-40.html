<p class="ex-stem"><b>40.</b> (가)의 정보 전달 방식으로 적절하지 <u>않은</u> 것은?</p>
<ol class="ex-choices">
<li>① 진행자가 어진 보관함이 오동나무로 만들어진 이유를 전문가에게 물으며 화제를 제시하였다.</li>
<li>② 어진 보관함의 두 가지 형태를 설명하기 위해 하나의 자료 화면에 각각의 이미지를 제시하였다.</li>
<li>③ 원통형 보관함의 유용성을 설명한 내용에 관한 부분을 확대하여 보여 주었다.</li>
<li>④ 진행자가 의향의 향을 맡은 후 이에 대한 감상을 표현하였다.</li>
<li>⑤ 의향 교체를 위한 준비에 관한 문헌 내용을 자막으로 제공하였다.</li>
</ol>
