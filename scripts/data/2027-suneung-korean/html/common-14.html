<p class="ex-stem"><b>14.</b> 윗글의 내용과 일치하지 <u>않는</u> 것은?</p>
<ol class="ex-choices">
<li>① 의견 표현은 가치 판단에 따라 그 의견의 진위가 판별된다.</li>
<li>② 개인은 헌법 제21조에 의거하여 표현의 자유를 보장받는다.</li>
<li>③ 민법 제751조는 모욕에 따른 손해 배상 청구의 근거로 쓰인다.</li>
<li>④ 헌법은 미디어로 인한 권리 침해의 피해 배상 청구를 보장한다.</li>
<li>⑤ 인격권의 핵심이자 법적 보호 대상인 명예는 사회적 평가를 뜻한다.</li>
</ol>
