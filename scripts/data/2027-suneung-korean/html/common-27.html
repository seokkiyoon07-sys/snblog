<p class="ex-stem"><b>27.</b> [A]에 대한 설명으로 가장 적절한 것은?</p>
<ol class="ex-choices">
<li>① 시간적 배경을 나타내는 사물을 활용하여 사건의 변화 양상을 보여 주고 있다.</li>
<li>② 인물에게 초점화된 서술자의 시선이 인물의 시선으로 이동함을 보여 주고 있다.</li>
<li>③ 일상적인 소재를 활용하여 인물과 주변 인물 사이의 친밀한 관계를 제시하고 있다.</li>
<li>④ 인물의 행동에 대한 관찰을 통해 인물들 간에 발생한 외적 갈등을 보여 주고 있다.</li>
<li>⑤ 과거 사건에 대한 회상을 통해 인물이 처해 있는 상황을 객관적으로 제시하고 있다.</li>
</ol>
