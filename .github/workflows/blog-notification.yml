name: Blog Post Notification

on:
  push:
    branches: [main]
    paths:
      - 'src/data/post-records.ts'
      - 'content/startup/snargpt-development-2026.html'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Notify published posts and timeline updates
        run: node scripts/notify-posts.cjs --send
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JANDI_WEBHOOK_URL: ${{ secrets.JANDI_WEBHOOK_URL }}
