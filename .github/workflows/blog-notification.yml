name: Blog Post Notification

on:
  push:
    branches: [main]
    paths:
      - 'src/data/post-records.ts'
      - 'content/**'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Notify changed published posts
        run: node scripts/notify-posts.cjs --send
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          JANDI_WEBHOOK_URL: 'https://wh.jandi.com/connect-api/webhook/13116580/2eb500fa1618a7c8b4d5ee7e29b46523'
