name: Validate Blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run linting
        run: npm run lint

      - name: Test post tools
        run: node --test scripts/post-tools.test.cjs

      - name: Build project
        run: npm run build

      - name: Test build
        run: |
          npm run start &
          sleep 10
          curl -f http://localhost:3000 || exit 1
