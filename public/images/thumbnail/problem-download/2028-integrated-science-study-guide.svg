<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">2028 수능 통합과학, 25개 예시문항에서 공부의 방향을 찾다</title>
  <desc id="description">통합사회 학습 가이드와 같은 짙은 녹색 배경, 얇은 테두리, 중앙의 흰색 제목으로 구성한 통합과학 썸네일.</desc>
  <rect width="1920" height="1080" fill="#005a41"/>
  <rect x="77" y="54" width="1766" height="972" fill="none" stroke="#b7dbcf" stroke-opacity=".35" stroke-width="1.5"/>
  <g fill="#c5e5d9" fill-opacity=".6" stroke="#d5ece3" stroke-opacity=".65" stroke-width="1.5">
    <rect x="69" y="50" width="15" height="8"/>
    <rect x="1836" y="50" width="15" height="8"/>
    <rect x="69" y="1022" width="15" height="8"/>
    <rect x="1836" y="1022" width="15" height="8"/>
  </g>
  <rect x="706" y="165" width="508" height="96" rx="48" fill="#ffffff" fill-opacity=".13" stroke="#b7dbcf" stroke-opacity=".2" stroke-width="2"/>
  <g font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">
    <text x="960" y="225" font-size="34" font-weight="600" fill="#e8fff6">2028 대입 개편 심층 분석</text>
    <g fill="#ffffff" font-size="96" font-weight="700" letter-spacing="-2">
      <text x="960" y="466">2028 수능 통합과학,</text>
      <text x="960" y="594">25개 예시문항에서</text>
      <text x="960" y="722">공부의 방향을 찾다</text>
    </g>
    <path d="M804 842H1116" stroke="#62cbaa" stroke-width="4"/>
    <text x="960" y="909" font-size="34" font-weight="400" fill="#c0e7d9">핵심 출제 경향 파악 및 고득점 대비 전략 가이드</text>
  </g>
</svg>
